name: Validate and release macOS app

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run hostless regression tests
        run: swift test
      - name: Exercise bridge installer transactions
        run: python3 scripts/test-bridge-installer.py
      - name: Build and verify universal controller
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: scripts/package-app.sh
      - name: Build and verify universal SayRoute Bridge
        run: scripts/package-sayroute-bridge.sh
      - name: Preserve validated packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
