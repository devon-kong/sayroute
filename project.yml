name: SayRoute
options:
  bundleIdPrefix: com.devonkong
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.devonkong.sayroute
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "21"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  SayRoute:
    type: application
    platform: macOS
    sources:
      - path: SayRoute
        excludes:
          - "*.md"
      - path: Shared
      - path: LICENSE
        buildPhase: resources
      - path: ATTRIBUTION.md
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - target: sayroute-updater
        embed: false
    postBuildScripts:
      - name: Embed verified update helper
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/sayroute-updater" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/sayroute-updater"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/sayroute-updater"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/sayroute-updater"
    settings:
      base:
        INFOPLIST_FILE: SayRoute/Info.plist
        CODE_SIGN_ENTITLEMENTS: SayRoute/SayRoute.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_NAME: "SayRoute"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    info:
      path: SayRoute/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "SayRoute needs microphone access to enable voice-to-text transcription."
        CFBundleName: "SayRoute"
        CFBundleDisplayName: "SayRoute"
        CFBundleIconFile: "AppIcon"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: SayRoute/SayRoute.entitlements
      properties:
        com.apple.security.app-sandbox: false
    scheme:
      testTargets:
        - SayRouteTests

  SayRouteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SayRouteTests
    dependencies:
      - target: SayRoute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SayRoute.app/Contents/MacOS/SayRoute"
        BUNDLE_LOADER: "$(TEST_HOST)"

  sayroute-bridge:
    type: tool
    platform: macOS
    sources:
      - path: sayroute-bridge
      - path: Shared
        excludes:
          - "Update*.swift"
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devonkong.sayroute.bridge
        PRODUCT_NAME: sayroute-bridge
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  sayroute-updater:
    type: tool
    platform: macOS
    sources:
      - path: sayroute-updater
      - path: Shared
        includes:
          - "Update*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devonkong.sayroute.updater
        PRODUCT_NAME: sayroute-updater
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
